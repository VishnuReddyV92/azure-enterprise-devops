replicaCount: 2

image:
  repository: acrenterprisedevops2026.azurecr.io/myapp
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

healthCheck:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 15